name: Main Branch Protection

on:
  pull_request:
    branches: [ main ]

jobs:
  pre-merge-checks:
    name: Pre-merge Validation
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      with:
        fetch-depth: 0
        
    - name: Check branch is from develop
      run: |
        # Ensure PR is from develop branch
        if [[ "${{ github.head_ref }}" != "develop" ]]; then
          echo "Error: Pull requests to main must come from develop branch"
          echo "Current branch: ${{ github.head_ref }}"
          exit 1
        fi
        
    - name: Check version tag
      run: |
        # Check if there's a version tag
        git fetch --tags
        LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "none")
        echo "Latest tag: $LATEST_TAG"
        
    - name: Verify all tests passed
      run: |
        echo "Checking if all CI tests passed..."
        # This will be checked by GitHub branch protection rules
        
    - name: Check for merge conflicts
      run: |
        git fetch origin main
        if git merge-tree $(git merge-base HEAD origin/main) HEAD origin/main | grep -q '<<<<<<<'; then
          echo "Error: Merge conflicts detected"
          exit 1
        fi
        echo "No merge conflicts detected"
        
    - name: Validate commit messages
      run: |
        # Check commit message format (conventional commits)
        git log origin/main..HEAD --pretty=format:"%s" | while read msg; do
          if ! echo "$msg" | grep -qE "^(feat|fix|docs|style|refactor|test|chore|perf|ci|build|revert)(\(.+\))?: .+"; then
            echo "Warning: Commit message does not follow conventional format: $msg"
          fi
        done

  changelog-check:
    name: Changelog Verification
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      
    - name: Check for changelog updates
      run: |
        if [ -f CHANGELOG.md ]; then
          echo "Changelog exists"
          # Check if changelog was updated in this PR
          git fetch origin main
          if git diff origin/main HEAD -- CHANGELOG.md | grep -q "^+"; then
            echo "✅ Changelog has been updated"
          else
            echo "⚠️  Warning: Consider updating CHANGELOG.md for this release"
          fi
        else
          echo "⚠️  Warning: CHANGELOG.md not found"
        fi

  documentation-check:
    name: Documentation Completeness
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      
    - name: Check documentation
      run: |
        echo "Checking documentation completeness..."
        
        # Check README
        if [ -f README.md ]; then
          echo "✅ README.md exists"
        else
          echo "❌ README.md missing"
          exit 1
        fi
        
        # Check key documentation
        test -f CONTRIBUTING.md && echo "✅ CONTRIBUTING.md exists" || echo "⚠️  CONTRIBUTING.md missing"
        test -d docs && echo "✅ docs/ directory exists" || echo "⚠️  docs/ directory missing"
        
    - name: Check for API documentation
      run: |
        if [ -d docs ]; then
          echo "Documentation files:"
          find docs -name "*.md" | head -10
        fi

  release-readiness:
    name: Release Readiness Check
    runs-on: ubuntu-latest
    needs: [pre-merge-checks, changelog-check, documentation-check]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      
    - name: Summary
      run: |
        echo "=========================================="
        echo "Release Readiness Summary"
        echo "=========================================="
        echo "✅ All pre-merge checks passed"
        echo "✅ Changelog verified"
        echo "✅ Documentation checked"
        echo ""
        echo "Ready for merge to main branch"
        echo "=========================================="
