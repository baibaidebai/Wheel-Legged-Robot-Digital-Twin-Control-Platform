name: CI/CD Pipeline

on:
  push:
    branches: [ develop, main ]
  pull_request:
    branches: [ develop, main ]

jobs:
  code-quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pylint black isort
        
    - name: Run flake8
      run: |
        # Stop the build if there are Python syntax errors or undefined names
        flake8 src/wheel_legged_control/wheel_legged_control --count --select=E9,F63,F7,F82 --show-source --statistics
        # Exit-zero treats all errors as warnings
        flake8 src/wheel_legged_control/wheel_legged_control --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
        
    - name: Check code formatting with black
      run: |
        black --check src/wheel_legged_control/wheel_legged_control || true
        
    - name: Check import sorting with isort
      run: |
        isort --check-only src/wheel_legged_control/wheel_legged_control || true

  cpp-quality:
    name: C++ Code Quality
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      
    - name: Install cppcheck
      run: |
        sudo apt-get update
        sudo apt-get install -y cppcheck
        
    - name: Run cppcheck
      run: |
        cppcheck --enable=all --suppress=missingIncludeSystem \
          --error-exitcode=0 \
          src/wheel_legged_control/src/ \
          src/wheel_legged_control/include/ || true

  python-tests:
    name: Python Unit Tests
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'
        
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          python3-dev \
          libxml2-dev \
          libxslt1-dev \
          libyaml-dev
        
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-cov pytest-xdist
        pip install numpy scipy matplotlib
        pip install pyyaml
        if [ -f requirements.txt ]; then pip install -r requirements.txt || true; fi
        
    - name: Run Python tests
      run: |
        cd "Wheel-Legged Robot Digital Twin Control Platform"
        pytest test/python/ -v --tb=short --maxfail=5 || true
        
    - name: Generate coverage report
      run: |
        cd "Wheel-Legged Robot Digital Twin Control Platform"
        pytest test/python/ --cov=src/wheel_legged_control/wheel_legged_control --cov-report=xml --cov-report=term || true

  build-ros2:
    name: ROS2 Build Test
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      
    - name: Set up ROS2 Humble
      run: |
        sudo apt-get update
        sudo apt-get install -y software-properties-common
        sudo add-apt-repository universe
        sudo apt-get update && sudo apt-get install -y curl
        sudo curl -sSL https://raw.githubusercontent.com/ros/rosdistro/master/ros.key -o /usr/share/keyrings/ros-archive-keyring.gpg
        echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/ros-archive-keyring.gpg] http://packages.ros.org/ros2/ubuntu $(. /etc/os-release && echo $UBUNTU_CODENAME) main" | sudo tee /etc/apt/sources.list.d/ros2.list > /dev/null
        sudo apt-get update
        sudo apt-get install -y ros-humble-desktop python3-colcon-common-extensions
        
    - name: Build ROS2 workspace
      run: |
        cd "Wheel-Legged Robot Digital Twin Control Platform"
        source /opt/ros/humble/setup.bash
        colcon build --packages-select wheel_legged_control || true
        
    - name: Run ROS2 tests
      run: |
        cd "Wheel-Legged Robot Digital Twin Control Platform"
        source /opt/ros/humble/setup.bash
        source install/setup.bash
        colcon test --packages-select wheel_legged_control || true

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [python-tests, build-ros2]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest numpy scipy matplotlib pyyaml
        if [ -f requirements.txt ]; then pip install -r requirements.txt || true; fi
        
    - name: Run integration tests
      run: |
        cd "Wheel-Legged Robot Digital Twin Control Platform"
        pytest test/integration/ -v --tb=short || true

  documentation:
    name: Documentation Check
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      
    - name: Check documentation files
      run: |
        cd "Wheel-Legged Robot Digital Twin Control Platform"
        # Check if key documentation files exist
        test -f README.md || echo "Warning: README.md not found"
        test -f CONTRIBUTING.md || echo "Warning: CONTRIBUTING.md not found"
        test -d docs || echo "Warning: docs directory not found"
        
    - name: Check for TODO and FIXME
      run: |
        cd "Wheel-Legged Robot Digital Twin Control Platform"
        echo "Checking for TODO and FIXME comments..."
        grep -r "TODO\|FIXME" src/wheel_legged_control/ || echo "No TODO/FIXME found"

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'
        
    - name: Install bandit
      run: |
        pip install bandit
        
    - name: Run security scan
      run: |
        cd "Wheel-Legged Robot Digital Twin Control Platform"
        bandit -r src/wheel_legged_control/wheel_legged_control -f json -o bandit-report.json || true
        bandit -r src/wheel_legged_control/wheel_legged_control || true

  summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [code-quality, cpp-quality, python-tests, build-ros2, integration-tests, documentation, security-scan]
    if: always()
    
    steps:
    - name: Check results
      run: |
        echo "CI/CD Pipeline completed"
        echo "All checks have been executed"
